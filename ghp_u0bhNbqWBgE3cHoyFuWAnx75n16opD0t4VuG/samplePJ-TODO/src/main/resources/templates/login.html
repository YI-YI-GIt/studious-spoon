<!DOCTYPE html>
<html lang="ja">
<head>
 <meta charset="UTF-8">
 <title>ログインページ</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
 <div class="container mt-5">
  <h1 class="text-center">ログイン</h1>
  <div class="card p-4 mx-auto mt-4" style="max-width: 400px;">
<!-- Thymeleafフォーム送信 -->
 <form action="/login" method="post" id="loginForm">
  <div class="mb-3">
   <label for="username" class="form-label">ユーザー名</label>
   <input type="text" class="form-control" id="username" name="username" required>
  </div>
  <div class="mb-3">
   <label for="password" class="form-label">パスワード</label>
   <input type="password" class="form-control" id="password" name="password" required>
  </div>
 <button type="submit" class="btn btn-primary w-100">ログイン</button>
 </form>
 
 <div class="mt-3 text-center text-muted">または</div>
 
<!-- 🌸 API直叩きボタン -->
<button class="btn btn-success w-100 mt-2" id="apiLoginBtn">APIでログイン</button>
  </div>
 </div>
</body>
</html>

<script>
  document.getElementById("apiLoginBtn").addEventListener("click", () => {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({
        username,
        password
      })
    }).then(res => {
      // 成功時にアサインされたページにリダイレクト
      if (res.ok) {
        window.location.href = "/tasks";
      }else{
	  alert("APIログイン失敗");
	  }
    });
  });
</script>
